name: release-please

# Maintains a rolling "chore: release X.Y.Z" PR from the conventional commits
# landing on main. Merging it tags the release and publishes GitHub release
# notes; pkg.go.dev picks the tag up on its own.
#
# No secrets needed: GITHUB_TOKEN is enough, matching nscaledev/billing-service,
# ai-crds and byom.
#
# One manual step per release, though. The `main` ruleset requires the `build`
# check, and because the release PR is authored by github-actions[bot] its `ci`
# run is created in the `action_required` state with no jobs, awaiting approval.
# Click "Approve and run" on the PR's Checks tab; `build` then reports and the
# PR becomes mergeable. Since the ruleset already requires a human approving
# review before merge, this costs one extra click rather than blocking anything.
#
# To remove that click, swap GITHUB_TOKEN for a GitHub App token as
# nscaledev/alfred, arkham and fleet-manager do — App-authored PRs are not
# treated as bot-authored for this purpose, so `ci` runs unattended. That needs
# an App ID and private key provisioned as secrets, which is why it is not the
# default here.
#
# Also required: Settings > Actions > General > "Allow GitHub Actions to create
# and approve pull requests" (already enabled on this repo).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
