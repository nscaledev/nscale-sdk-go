name: release-please

# Maintains a rolling "chore: release X.Y.Z" PR from the conventional commits
# landing on main. Merging it tags the release and publishes GitHub release
# notes; pkg.go.dev picks the tag up on its own.
#
# Two repo settings this needs:
#   - Settings > Actions > General > "Allow GitHub Actions to create and
#     approve pull requests" must be enabled.
#   - The release PR is opened by GITHUB_TOKEN, so it does not trigger the `ci`
#     workflow (GitHub suppresses workflow runs for token-authored events). The
#     PR only touches CHANGELOG.md and .release-please-manifest.json, so that is
#     acceptable; swap in a PAT via the `token` input if CI on it is wanted.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
