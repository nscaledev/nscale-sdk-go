name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - uses: extractions/setup-just@v4
      # Builds, tests, and re-runs oapi-codegen to confirm the committed
      # *.gen.go files match the vendored specs. Hermetic: no network.
      - run: just check
